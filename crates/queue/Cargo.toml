[package]
name = "alternate-queue"
version = "0.1.0"
edition = "2024"

[dependencies]
alternate-migration = {workspace = true, optional = true }

deadpool-postgres = { version = "0.14.2", optional = true }
jiff.workspace = true
rust-embed = { version = "8.12.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["macros"], optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-jiff-0_2", "with-serde_json-1"], optional = true }
tracing = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
postgres = [
    "alternate-migration/postgres",
    "dep:alternate-migration",
    "dep:deadpool-postgres",
    "dep:rust-embed",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:tracing",
]

[lints]
workspace = true
