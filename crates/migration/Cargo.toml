[package]
name = "alternate-migration"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
jiff.workspace = true
rusqlite = { version = "0.40.2", features = ["jiff"], optional = true }
thiserror.workspace = true
tokio = { version = "1.53.1", optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-jiff-0_2"], optional = true }

[dev-dependencies]
blake3 = "1.8.7"
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
postgres = ["dep:tokio", "dep:tokio-postgres"]
sqlite = ["dep:rusqlite"]
sqlite-bundled = ["sqlite", "rusqlite/bundled"]

[lints]
workspace = true
