[package]
name = "alternate-http"
version = "0.1.0"
edition = "2024"

[dependencies]
alternate-codec = { workspace = true, optional = true }
alternate-kv = { workspace = true, optional = true }

bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
# http-cache = { version = "1.0.0-alpha.7", optional = true }
# http-cache-semantics = { version = "3.0.0", optional = true }
reqwest = { version = "0.13.4", optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tower = { version = "0.5.3", features = ["buffer", "util"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }

[features]
default = ["tracing", "typed"]
# cache = ["dep:alternate-codec", "dep:alternate-kv", "dep:http-cache", "dep:http-cache-semantics"]
reqwest = ["dep:reqwest"]
tower = ["dep:tower"]
tracing = ["dep:tracing"]
typed = ["dep:alternate-codec", "dep:serde"]

[lints]
workspace = true
