[package]
name = "alternate-http"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
reqwest = { version = "0.13.4", optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }

[features]
default = ["tracing"]
reqwest = ["dep:reqwest"]
tracing = ["dep:tracing"]

[lints]
workspace = true
