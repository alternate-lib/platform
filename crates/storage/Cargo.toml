[package]
name = "alternate-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
rust-s3 = { version = "0.37.2",
  default-features = false,
  features = [
    "fail-on-err",
    "tokio-rustls-tls",
  ],
  optional = true
}
thiserror.workspace = true
tokio = { version = "1.53.1", optional = true, features = ["fs"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["tracing"]
fs = ["dep:tokio"]
s3 = ["dep:rust-s3"]
tracing = ["dep:tracing"]

[lints]
workspace = true
