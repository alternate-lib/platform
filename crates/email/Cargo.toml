[package]
name = "alternate-email"
version = "0.1.0"
edition = "2024"

[dependencies]
lettre = {
  version = "0.11.23",
  default-features = false,
  features = [
    "aws-lc-rs",
    "builder",
    "pool",
    "smtp-transport",
    "tokio1-rustls",
    "webpki-roots",
  ],
  optional = true
}
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["tracing"]
smtp = ["dep:lettre"]
tracing = ["dep:tracing"]

[lints]
workspace = true
