[package]
name = "alternate-email"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
lettre = {
  version = "0.11.23",
  default-features = false,
  features = [
    "aws-lc-rs",
    "builder",
    "pool",
    "smtp-transport",
    "tokio1-rustls",
    "webpki-roots",
  ],
  optional = true
}
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[features]
default = ["tracing"]
smtp = ["dep:lettre"]
tracing = ["dep:tracing"]

[lints]
workspace = true
